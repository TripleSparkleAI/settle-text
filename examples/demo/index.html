<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>settle-text demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0c0a10; color: #efe9f7; font-family: system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 24px 96px; }
      h2 { font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #9a8fb0; margin: 48px 0 12px; }
      p.note { color: #b7adc9; font-size: 14px; max-width: 62ch; }
      pre { background: #15121c; border: 1px solid #2a2436; border-radius: 6px; padding: 12px 14px; font-size: 12.5px; overflow: auto; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
      .perf { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9dff3a; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
